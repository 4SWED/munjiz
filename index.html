<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مُنجز</title>
<meta name="description" content="دفتر الدراسة: مهامك واختباراتك بنظرة، وتسجيل سريع بجملة — يعمل بدون إنترنت">
<meta name="theme-color" content="#F6F2EA" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مُنجز">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/naskh-ar.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ruqaa-700-ar.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // apply the saved theme before first paint (no white flash at night)
  try { const s = JSON.parse(localStorage.getItem('munjiz.data') || '{}').settings || {}; const th = s.theme || 'auto';
    document.documentElement.dataset.theme = th === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : th; } catch (e) {}
</script>
<style>
  @font-face{font-family:'Naskh';src:url(fonts/naskh-ar.woff2) format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:'Naskh';src:url(fonts/naskh-la.woff2) format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
  @font-face{font-family:'Ruqaa';src:url(fonts/ruqaa-700-ar.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:'Ruqaa';src:url(fonts/ruqaa-700-la.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}

  /* Calm paper palette: warm off-white, soft navy ink, low-contrast lines. Dark = warm charcoal, never pure black. */
  :root,[data-theme=light]{
    --bg:#F1ECE1; --paper:#F9F6EF; --card:#FFFFFF; --ink:#2C3346; --ink-2:#4D5468; --muted:#7A7467; --faint:#ADA697;
    --line:#E7E0D2; --line-2:#D9D0BF; --grid:rgba(44,51,70,.055);
    --accent:#A9532F; --accent-soft:#F4E5DB; --today:#F3E2A9; --today-ink:#5B4710;
    --ok:#3E8A5B; --ok-soft:#E1F0E6; --warn:#A86A12; --warn-soft:#FBEFD9; --danger:#B6452F; --danger-soft:#F7E2DC;
    --sel:#2C3346; --sel-ink:#F9F6EF; --shadow:0 1px 2px rgba(44,51,70,.06),0 4px 14px rgba(44,51,70,.06);
    --scrim:rgba(30,32,40,.42); color-scheme:light;
  }
  [data-theme=dark]{
    --bg:#141519; --paper:#1B1C21; --card:#22242A; --ink:#E8E3D7; --ink-2:#C7C1B4; --muted:#9A9488; --faint:#646058;
    --line:#2D2F35; --line-2:#3A3C43; --grid:rgba(255,255,255,.03);
    --accent:#E0966C; --accent-soft:#3A2A21; --today:#4A3E1C; --today-ink:#F3DE9C;
    --ok:#73C995; --ok-soft:#1E3127; --warn:#E3B062; --warn-soft:#3A2F1C; --danger:#EF8C78; --danger-soft:#3D2420;
    --sel:#E8E3D7; --sel-ink:#1B1C21; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
  :root{--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--tabbar:64px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  html{background:var(--bg)}
  body{font-family:'Naskh','Noto Naskh Arabic','Geeza Pro',serif;font-size:16px;color:var(--ink);line-height:1.55;min-height:100dvh;background:var(--paper);
    background-image:radial-gradient(var(--grid) 1.2px,transparent 1.3px);background-size:22px 22px;overscroll-behavior-y:none;transition:background-color .2s,color .2s}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  h1,h2,h3{margin:0;font-weight:700}
  .ruqaa{font-family:'Ruqaa',serif}
  .ic{flex:none}
  .sp{flex:1}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none!important}

  /* ---------- header ---------- */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(6px + var(--safe-t)) 10px 6px 6px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Ruqaa',serif;font-size:1.4rem;line-height:1}
  .brand img{width:28px;height:28px;border-radius:8px}
  .ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);transition:background .15s}
  .ibtn:active{background:var(--line)}

  /* ---------- layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:0 0 calc(var(--tabbar) + 24px + var(--safe-b))}
  .pane{padding:14px 16px 8px}
  body[data-tab=agenda] #calPane,body[data-tab=cal] #agendaPane{display:none}

  /* ---------- glance header ---------- */
  .glance{display:flex;align-items:center;gap:14px;padding:6px 2px 14px}
  .glance .gd h1{font-family:'Ruqaa',serif;font-size:2.1rem;line-height:1.05}
  .glance .gd p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
  .ring{position:relative;width:58px;height:58px;flex:none}
  .ring svg{display:block}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem;font-variant-numeric:tabular-nums}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.86rem;color:var(--ink-2)}
  .pill.exam{background:var(--danger-soft);border-color:transparent;color:var(--danger);font-weight:700}
  .pill.streak{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:700}
  .pill.done{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}

  /* ---------- quick add ---------- */
  .qa{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px 4px 14px;margin-bottom:6px}
  .qa-row{display:flex;align-items:center;gap:8px}
  .qa-row>.ic{color:var(--accent)}
  .qa input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:12px 0;outline:none}
  .qa input::placeholder{color:var(--faint)}
  .qa input::-webkit-calendar-picker-indicator,.big-in::-webkit-calendar-picker-indicator{display:none!important}
  .qa .go{height:40px;padding:0 14px;border-radius:12px;background:var(--sel);color:var(--sel-ink);font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .qa .more{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
  .qa .more:active{background:var(--line)}
  .qprev{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 8px}
  .chip-s{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .qa-hint{font-size:.8rem;color:var(--muted);margin:2px 4px 14px}

  /* ---------- task rows ---------- */
  .sec{margin-top:14px}
  .sec-h{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;font-size:.9rem;font-weight:700;color:var(--ink-2)}
  .sec-h .n{font-weight:500;color:var(--muted);font-size:.85rem}
  .sec-h .act{margin-inline-start:auto;font-size:.85rem;font-weight:700;color:var(--accent);min-height:36px;padding:0 6px;display:inline-flex;align-items:center;gap:4px}
  .sec.over .sec-h{color:var(--danger)}
  .list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .rv{position:absolute;inset-block:0;display:flex;align-items:center;gap:6px;padding:0 18px;font-weight:700;font-size:.9rem;opacity:0}
  .rv-done{inset-inline-start:0;background:var(--ok);color:#fff;width:100%;justify-content:flex-start}
  .rv-later{inset-inline-end:0;background:var(--warn);color:#fff;width:100%;justify-content:flex-end}
  .row.sw-done .rv-done,.row.sw-later .rv-later{opacity:1}
  .row-in{position:relative;display:flex;align-items:center;gap:4px;min-height:60px;padding:4px 4px 4px 2px;background:var(--card);touch-action:pan-y;transition:transform .18s ease-out}
  .row.dragging .row-in{transition:none}
  .row-in::before{content:'';position:absolute;inset-block:12px;inset-inline-start:0;width:3px;border-radius:0 3px 3px 0;background:transparent}
  .row.p1 .row-in::before{background:var(--warn)}
  .row.p2 .row-in::before{background:var(--danger)}
  .ck{width:48px;height:48px;display:grid;place-items:center;flex:none}
  .ck i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;transition:background .15s,border-color .15s}
  .ck i svg{opacity:0;color:#fff;transition:opacity .15s}
  .row.exam .ck i{border-radius:7px}
  .row.done .ck i{background:var(--ok);border-color:var(--ok)}
  .row.done .ck i svg{opacity:1}
  .rb{flex:1;min-width:0;text-align:start;padding:8px 2px}
  .rb .tt{display:block;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .row.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
  .rb .mt{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px;font-size:.8rem;color:var(--muted);align-items:center}
  .mt .sd{display:inline-flex;align-items:center;gap:5px}
  .mt .sd i{width:8px;height:8px;border-radius:50%}
  .mt .ex{color:var(--danger);font-weight:700}
  .mt .when{color:var(--ink-2);font-weight:600}
  .mt .late{color:var(--danger);font-weight:600}
  .pf{width:44px;height:48px;display:grid;place-items:center;color:var(--line-2);flex:none}
  .row.p1 .pf{color:var(--warn)}
  .row.p2 .pf{color:var(--danger)}
  .row.done .pf{visibility:hidden}
  .fold{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;color:var(--muted);font-size:.88rem;font-weight:600}
  .fold .ic{transition:transform .15s}
  .fold[aria-expanded=true] .ic{transform:rotate(180deg)}
  .empty-day{padding:18px 16px;text-align:center;color:var(--muted);font-size:.92rem}
  .tip{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line-2);color:var(--ink-2);font-size:.86rem}
  .tip .ic{color:var(--accent)}
  .tip p{margin:0;flex:1}
  .tip .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
  .welcome{text-align:center;padding:26px 10px 10px}
  .welcome h2{font-family:'Ruqaa',serif;font-size:1.7rem}
  .welcome p{color:var(--ink-2);margin:6px auto 12px;max-width:34ch}
  .welcome .ex{display:grid;gap:6px;margin:0 auto 16px;max-width:320px}
  .welcome .ex button{border:1px dashed var(--line-2);border-radius:12px;padding:9px 12px;color:var(--ink-2);font-size:.92rem;background:var(--card)}
  .lbtn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);font-weight:700;color:var(--ink-2);background:var(--card);display:inline-flex;align-items:center;gap:6px}

  /* ---------- calendar (clean: no boxes, numbers in circles, dots below) ---------- */
  .cal-h{display:flex;align-items:center;gap:4px;margin-bottom:6px}
  .cal-h h1{font-family:'Ruqaa',serif;font-size:1.9rem;line-height:1.1;white-space:nowrap}
  .cal-h h1 small{font-family:'Naskh',serif;font-size:.5em;color:var(--muted);font-weight:500;margin-inline-start:6px}
  .navb{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
  .navb:active{background:var(--line)}
  .tbtn{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:.85rem;font-weight:700;color:var(--ink-2)}
  .seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--line);margin-bottom:10px}
  .seg button{height:34px;padding:0 16px;border-radius:9px;font-size:.88rem;font-weight:700;color:var(--muted)}
  .seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .calbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 6px 8px;box-shadow:var(--shadow);touch-action:pan-y}
  .wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:4px}
  .wd div{text-align:center;font-size:.76rem;color:var(--faint);font-weight:600}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
  .d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0 5px;border-radius:12px;min-height:52px}
  .d .dn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
  .d.out .dn{color:var(--faint);font-weight:400}
  .d.today .dn{background:var(--today);color:var(--today-ink);font-weight:700}
  .d.sel .dn{background:var(--sel);color:var(--sel-ink);font-weight:700}
  .d:active .dn{transform:scale(.94)}
  .dd{display:flex;gap:3px;height:7px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.done{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor;opacity:.7}
  .dot.exam{border-radius:1.5px;transform:rotate(45deg);width:6px;height:6px}
  .dd .pl{font-size:.62rem;color:var(--muted);line-height:1}
  /* week strip */
  .wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .w{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:14px;transition:background .15s}
  .w .wn{font-size:.74rem;color:var(--muted);font-weight:600}
  .w .dn{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
  .w.today{background:var(--today);color:var(--today-ink)}
  .w.today .wn{color:var(--today-ink)}
  .w.sel{background:var(--sel);color:var(--sel-ink)}
  .w.sel .wn{color:var(--sel-ink);opacity:.8}
  .w .cnt{font-size:.68rem;color:var(--muted);height:12px;line-height:12px}
  .w.sel .cnt,.w.today .cnt{color:inherit;opacity:.75}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 8px 0;font-size:.76rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .day-h{display:flex;align-items:baseline;gap:8px;margin:18px 4px 8px}
  .day-h h2{font-family:'Ruqaa',serif;font-size:1.45rem}
  .day-h .r{color:var(--muted);font-size:.88rem}
  .day-h .c{margin-inline-start:auto;color:var(--muted);font-size:.85rem}

  /* ---------- tab bar ---------- */
  .tabbar{position:fixed;z-index:30;inset-inline:0;bottom:0;height:calc(var(--tabbar) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--faint)}
  .tab[aria-current=page]{color:var(--ink)}
  .tab .b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:.68rem;display:grid;place-items:center;position:absolute;transform:translate(-14px,-12px)}
  .tab .tw{position:relative}
  .add{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--sel);color:var(--sel-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(44,51,70,.25);transform:translateY(-10px);transition:transform .12s}
  .add:active{transform:translateY(-8px) scale(.96)}

  /* ---------- sheets ---------- */
  dialog.sheet{border:0;padding:0;background:var(--paper);color:var(--ink);font-family:inherit;width:100%;max-width:100%;max-height:94dvh;margin:auto 0 0;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18)}
  dialog.sheet[open]{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(32px);opacity:.5}to{transform:none;opacity:1}}
  dialog.sheet::backdrop{background:var(--scrim)}
  .sheet form,.sheet .wrapf{display:flex;flex-direction:column;max-height:94dvh}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
  .sh-head{display:flex;align-items:center;gap:10px;padding:6px 12px 2px 16px}
  .sh-head h2{font-family:'Ruqaa',serif;font-size:1.45rem;flex:1}
  .sh-body{padding:4px 16px 10px;overflow:auto;display:grid;gap:14px;overscroll-behavior:contain}
  .sh-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line)}
  .big-in{width:100%;font-size:18px;font-weight:600;border:0;border-bottom:2px solid var(--line-2);background:transparent;padding:10px 2px;outline:none}
  .big-in:focus{border-bottom-color:var(--accent)}
  .big-in::placeholder{color:var(--faint);font-weight:400}
  .heard{font-size:.82rem;color:var(--muted);min-height:1.2em;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .field{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
  .lab{font-size:.8rem;font-weight:700;color:var(--muted)}
  .scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 1px 4px;margin:0 -16px;padding-inline:16px}
  .scroller::-webkit-scrollbar{display:none}
  .opt{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);font-size:.92rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .opt[aria-pressed=true]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
  .opt .sw{width:10px;height:10px;border-radius:50%}
  .opt.p1[aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff}
  .opt.p2[aria-pressed=true]{background:var(--danger);border-color:var(--danger);color:#fff}
  .in{font-size:16px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:8px 10px;min-height:40px}
  .in:focus{outline:none;border-color:var(--accent)}
  .in.sm{flex:none;width:auto}
  .trow{display:flex;align-items:center;gap:10px;margin-top:2px}
  .trow .in{min-width:130px}
  .trow .clr{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
  textarea.in{min-height:70px;resize:vertical;width:100%}
  details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;color:var(--muted);min-height:40px}
  details.more summary::-webkit-details-marker{display:none}
  details.more[open] summary .ic{transform:rotate(180deg)}
  details.more .inner{display:grid;gap:12px;padding-top:4px}
  .err{color:var(--danger);font-size:.85rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);font-weight:700;background:var(--card);color:var(--ink)}
  .btn.primary{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
  .btn.ghost{background:transparent}
  .btn.danger{border-color:transparent;color:var(--danger);background:transparent;padding:0 10px}
  .btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.wide{width:100%}
  .hint{font-size:.82rem;color:var(--muted);margin:0}
  .check{display:flex;gap:10px;align-items:center;min-height:44px}
  .check input{width:22px;height:22px;accent-color:var(--accent)}

  /* settings */
  .set h3{font-size:1.02rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .set section{border-bottom:1px solid var(--line);padding-bottom:16px}
  .set section:last-child{border:0}
  .subj{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .subj .swb{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--card)}
  .subj .swb i{width:18px;height:18px;border-radius:50%}
  .subj .in{width:100%}
  .palette{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
  .palette button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
  .palette button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .status{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:6px 0 0}
  .status i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
  .status.off i{background:var(--faint)}
  ol.steps{margin:6px 0 0;padding-inline-start:20px;font-size:.92rem}
  ol.steps li{margin-bottom:4px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--ink-2)}

  .toast{position:fixed;inset-inline:12px;bottom:calc(var(--tabbar) + 14px + var(--safe-b));z-index:100;margin-inline:auto;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--sel);color:var(--sel-ink);padding:8px 8px 8px 16px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .2s ease-out,opacity .2s ease-out;font-size:.95rem}
  .toast span{flex:1}
  .toast.show{transform:none;opacity:1;pointer-events:auto}
  .toast button{border:0;color:var(--today);font-weight:700;min-height:40px;padding:0 10px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  [data-theme=dark] .toast button{color:var(--accent)}

  /* ---------- tablet / desktop: both panes side by side ---------- */
  @media (min-width:900px){
    body[data-tab] #calPane,body[data-tab] #agendaPane{display:block}
    main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:8px;padding:12px 16px 40px}
    .pane{padding:14px 12px}
    .tabbar{inset-inline:auto;inset-inline-end:28px;bottom:28px;width:auto;height:auto;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;display:block}
    .tabbar .tab{display:none}
    .add{transform:none}
    .toast{bottom:28px}
    .d{min-height:64px}
    .d .dn{width:40px;height:40px}
    dialog.sheet{width:min(560px,calc(100vw - 32px));margin:auto;border-radius:18px}
    .grab{display:none}
  }
  @media (prefers-reduced-motion:reduce){dialog.sheet[open]{animation:none}.toast,.row-in{transition:none}}
</style>
</head>
<body data-tab="agenda">
<header class="bar">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28">مُنجز</div>
  <span class="sp"></span>
  <button class="ibtn" data-act="theme" id="themeBtn" aria-label="الوضع الليلي"></button>
  <button class="ibtn" data-act="menu" id="menuBtn" aria-label="الإعدادات"></button>
</header>

<main>
  <section class="pane" id="agendaPane" aria-label="مهامي">
    <div id="glance"></div>
    <form class="qa" id="qaAgenda" autocomplete="off" data-default="today">
      <div class="qa-row">
        <span class="qi"></span>
        <label class="sr" for="qaAgendaIn">أضف مهمة</label>
        <input id="qaAgendaIn" list="recent" enterkeyhint="done" maxlength="140" placeholder="اكتب مهمة… مثل: واجب رياضيات بكرة">
        <button type="button" class="more" data-more aria-label="تفاصيل"></button>
        <button type="submit" class="go" hidden>أضف</button>
      </div>
      <div class="qprev" hidden></div>
    </form>
    <div id="agenda"></div>
  </section>

  <section class="pane" id="calPane" aria-label="التقويم">
    <div class="cal-h">
      <h1 id="mt" aria-live="polite"></h1>
      <span class="sp"></span>
      <button class="tbtn" data-act="today">اليوم</button>
      <button class="navb" data-act="prev" id="pv" aria-label="السابق"></button>
      <button class="navb" data-act="next" id="nx" aria-label="التالي"></button>
    </div>
    <div class="seg" role="group" aria-label="طريقة العرض">
      <button data-act="view" data-v="month" id="vMonth">شهر</button>
      <button data-act="view" data-v="week" id="vWeek">أسبوع</button>
    </div>
    <div class="calbox" id="calbox">
      <div class="wd" id="wd"></div>
      <div id="grid" role="grid" aria-label="الأيام"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="day-h" id="dayHead"></div>
    <div id="dayList"></div>
    <form class="qa" id="qaDay" autocomplete="off" data-default="selected" style="margin-top:8px">
      <div class="qa-row">
        <span class="qi"></span>
        <label class="sr" for="qaDayIn">أضف مهمة لهذا اليوم</label>
        <input id="qaDayIn" list="recent" enterkeyhint="done" maxlength="140" placeholder="أضف لهذا اليوم…">
        <button type="button" class="more" data-more aria-label="تفاصيل"></button>
        <button type="submit" class="go" hidden>أضف</button>
      </div>
      <div class="qprev" hidden></div>
    </form>
  </section>
</main>

<nav class="tabbar" aria-label="التنقل">
  <button class="tab" data-act="tab" data-t="agenda" id="tAgenda"></button>
  <button class="add" data-act="new" id="addBtn" aria-label="مهمة جديدة"></button>
  <button class="tab" data-act="tab" data-t="cal" id="tCal"></button>
</nav>
<datalist id="recent"></datalist>

<script src="core.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
