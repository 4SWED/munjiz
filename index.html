<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مُنجز</title>
<meta name="description" content="دفتر الدراسة: مهامك واختباراتك بنظرة، وتسجيل سريع بجملة — يعمل بدون إنترنت">
<meta name="theme-color" content="#FFFCF5" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مُنجز">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/naskh-ar.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/ruqaa-700-ar.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // apply the saved theme before first paint (no white flash at night)
  try { const s = JSON.parse(localStorage.getItem('munjiz.data') || '{}').settings || {}; const th = s.theme || 'auto';
    document.documentElement.dataset.theme = th === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : th; } catch (e) {}
</script>
<style>
  @font-face{font-family:'Naskh';src:url(fonts/naskh-ar.woff2) format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:'Naskh';src:url(fonts/naskh-la.woff2) format('woff2');font-weight:400 700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
  @font-face{font-family:'Ruqaa';src:url(fonts/ruqaa-700-ar.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
  @font-face{font-family:'Ruqaa';src:url(fonts/ruqaa-700-la.woff2) format('woff2');font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}

  /* Notebook: dotted paper, ink lines, Ruqaa headings, highlighter, red pen, sticky notes, rubber stamps.
     Dark = the same notebook at night: navy paper with chalky ink. */
  :root,[data-theme=light]{
    --desk:#E9E2D3; --paper:#FFFCF5; --paper-2:#FBF6EA; --ink:#1F2A44; --ink-2:#3B4763; --muted:#6E6A60; --faint:#ADA696;
    --dotgrid:#E3DCCB; --rule:#C9D7E8; --soft:#E8E0CE; --margin:#E8A0A0; --hatch:#F1EADA;
    --red:#B93A0C; --amber:#93560A; --green:#2F7D4F; --hl:#FFE98A; --hl-ink:#1F2A44; --sticky:#FFF3A3; --sticky-ink:#1F2A44; --tape:rgba(186,214,233,.85);
    --sel:#1F2A44; --sel-ink:#FFFCF5; --scrim:rgba(31,42,68,.45); color-scheme:light;
  }
  [data-theme=dark]{
    --desk:#11151E; --paper:#1A2030; --paper-2:#1E2536; --ink:#E7E2D4; --ink-2:#C9C4B6; --muted:#9C978B; --faint:#5E6474;
    --dotgrid:#28304A; --rule:#2E3A55; --soft:#2A3146; --margin:#7A3B3B; --hatch:#20283A;
    --red:#F08A6C; --amber:#E6B35E; --green:#79CF98; --hl:#6B5A1C; --hl-ink:#FFF1BE; --sticky:#E9D98A; --sticky-ink:#1F2A44; --tape:rgba(120,150,180,.55);
    --sel:#E7E2D4; --sel-ink:#1A2030; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
  :root{--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--tabbar:64px;--b:1.5px solid var(--ink);--wob:3px 6px 4px 5px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  html{background:var(--desk)}
  body{font-family:'Naskh','Noto Naskh Arabic','Geeza Pro',serif;font-size:16px;color:var(--ink);line-height:1.55;min-height:100dvh;background:var(--paper);
    background-image:radial-gradient(var(--dotgrid) 1.2px,transparent 1.3px);background-size:22px 22px;background-position:11px 11px;overscroll-behavior-y:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
  :focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
  h1,h2,h3{margin:0;font-family:'Ruqaa',serif;font-weight:700}
  .ic{flex:none}
  .sp{flex:1}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  [hidden]{display:none!important}

  /* ---------- header ---------- */
  .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(6px + var(--safe-t)) 10px 6px 6px;background:var(--paper);border-bottom:var(--b)}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Ruqaa',serif;font-size:1.45rem;line-height:1}
  .brand img{width:28px;height:28px;border-radius:8px}
  .ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink)}
  .ibtn:active{background:var(--soft)}

  /* ---------- layout ---------- */
  main{max-width:1240px;margin:0 auto;padding:0 0 calc(var(--tabbar) + 24px + var(--safe-b))}
  .pane{padding:14px 14px 8px;position:relative}
  body[data-tab=agenda] #calPane,body[data-tab=cal] #agendaPane{display:none}

  /* ---------- glance (today's page header) ---------- */
  .glance{display:flex;align-items:flex-end;gap:12px;padding:4px 2px 2px}
  .glance .num{font-family:'Ruqaa',serif;font-size:3.6rem;line-height:.9;font-weight:700}
  .glance h1{font-size:1.6rem;line-height:1.15}
  .glance p{margin:0;color:var(--muted);font-size:.92rem}
  .tally{display:flex;gap:4px;flex-wrap:wrap;margin:10px 2px 4px;align-items:center}
  .tally i{width:15px;height:15px;border:1.5px solid var(--ink);border-radius:2px 4px 3px 2px}
  .tally i.on{background:var(--ink)}
  .tally span{font-size:.85rem;color:var(--muted);margin-inline-start:6px}
  .stamps{display:flex;gap:8px;flex-wrap:wrap;margin:8px 2px 0}
  .stampx{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;padding:1px 9px;border:1.5px solid currentColor;border-radius:4px;transform:rotate(-2deg)}
  .stampx.streak{color:var(--amber)}
  .stampx.done{color:var(--green)}
  .sticky{display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:center;width:calc(100% - 16px);max-width:420px;margin:20px 8px 2px;text-align:start;background:var(--sticky);color:var(--sticky-ink);padding:10px 14px 11px;transform:rotate(-1deg);box-shadow:0 10px 18px -8px rgba(80,60,0,.35);position:relative}
  .sticky::before{content:'';position:absolute;top:-11px;inset-inline-start:42%;width:76px;height:22px;background:var(--tape);transform:rotate(4deg)}
  .sticky .h{font-family:'Ruqaa',serif;font-size:1.05rem}
  .sticky .cd{font-family:'Ruqaa',serif;font-size:1.55rem;line-height:1.1;color:#B93A0C;grid-row:span 3}
  .sticky .h{grid-column:2}
  .sticky .t{font-weight:700}
  .sticky .s{font-size:.82rem;opacity:.75}

  /* ---------- quick add: write on the next ruled line ---------- */
  .qa{margin:12px 0 4px;border-bottom:1.5px solid var(--ink);padding:0 2px}
  .qa-row{display:flex;align-items:center;gap:8px;min-height:50px}
  .qa-row>.qi{color:var(--muted);display:grid}
  .qa input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none;font-style:italic}
  .qa input:focus{font-style:normal}
  .qa input::placeholder{color:var(--faint)}
  .qa input::-webkit-calendar-picker-indicator,.big-in::-webkit-calendar-picker-indicator{display:none!important}
  .qa .go{height:38px;padding:0 14px;border-radius:var(--wob);background:var(--ink);color:var(--paper);font-weight:700}
  .qa .more{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
  .qprev{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 8px}
  .chip-s{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;padding:0 8px;border:1.5px solid var(--ink-2);border-radius:4px;color:var(--ink-2);font-weight:600;line-height:1.7}
  .chip-s .dot{width:7px;height:7px}

  /* ---------- sections + ruled task lines ---------- */
  .sec{margin-top:18px}
  .sec-h{display:flex;align-items:center;gap:8px;padding:0 2px 2px}
  .sec-h b{font-family:'Ruqaa',serif;font-size:1.3rem;font-weight:700}
  .sec-h .n{color:var(--muted);font-size:.85rem}
  .sec-h .act{margin-inline-start:auto;font-size:.85rem;font-weight:700;color:var(--red);min-height:36px;padding:0 10px;border:1.5px solid var(--red);border-radius:var(--wob);display:inline-flex;align-items:center;gap:4px}
  .sec.over .sec-h b,.sec.over .sec-h .ic{color:var(--red)}
  .list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .row{position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
  .rv{position:absolute;inset-block:0;display:flex;align-items:center;gap:6px;padding:0 18px;font-family:'Ruqaa',serif;font-size:1.1rem;opacity:0;width:100%}
  .rv-done{inset-inline-start:0;background:#DCEFE2;color:#1F6B3F;justify-content:flex-start}
  .rv-later{inset-inline-end:0;background:#FBEBCB;color:#7A4A06;justify-content:flex-end}
  .row.sw-done .rv-done,.row.sw-later .rv-later{opacity:1}
  .row-in{position:relative;display:flex;align-items:center;gap:4px;min-height:56px;padding:2px 0;background:var(--paper);touch-action:pan-y;transition:transform .18s ease-out}
  .row.dragging .row-in{transition:none}
  .ck{width:46px;height:48px;display:grid;place-items:center;flex:none}
  .ck i{width:24px;height:24px;border:2px solid var(--ink);border-radius:3px 5px 3px 4px;display:grid;place-items:center}
  .ck i svg{opacity:0;color:var(--red);transform:scale(1.45) rotate(-6deg)}
  .row.exam .ck i{border-radius:50% 45% 55% 48%}
  .row.done .ck i svg{opacity:1}
  .rb{flex:1;min-width:0;text-align:start;padding:6px 2px}
  .rb .tt{display:block;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
  .row.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
  .rb .mt{display:flex;flex-wrap:wrap;gap:0 9px;margin-top:1px;font-size:.8rem;color:var(--muted);align-items:center}
  .mt .sd{display:inline-flex;align-items:center;gap:4px;font-weight:700}
  .mt .sd i{width:8px;height:8px;border-radius:50% 45% 55% 50%}
  .mt .ex{color:var(--red);font-weight:700}
  .mt .when{color:var(--ink-2);font-weight:700}
  .mt .late{color:var(--red);font-weight:700}
  .pf{min-width:44px;height:48px;display:grid;place-items:center;flex:none;color:var(--faint);padding:0 4px}
  .pf .stamp{font-size:.75rem;font-weight:700;padding:0 7px;border:1.5px solid currentColor;border-radius:4px;transform:rotate(-5deg);white-space:nowrap;line-height:1.7}
  .row.p1 .pf{color:var(--amber)}
  .row.p2 .pf{color:var(--red)}
  .row.done .pf{visibility:hidden}
  .fold{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;color:var(--muted);font-size:.88rem;font-style:italic}
  .fold .ic{transition:transform .15s}
  .fold[aria-expanded=true] .ic{transform:rotate(180deg)}
  .empty-day{padding:14px 4px;color:var(--muted);font-style:italic;font-size:.92rem;border-bottom:1px solid var(--rule)}
  .tip{display:flex;gap:10px;align-items:center;margin-top:18px;padding:10px 12px;border:1.5px dashed var(--ink-2);border-radius:var(--wob);color:var(--ink-2);font-size:.86rem}
  .tip p{margin:0;flex:1}
  .tip .x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
  .welcome{text-align:center;padding:22px 6px 8px}
  .welcome h2{font-size:1.7rem}
  .welcome p{color:var(--ink-2);margin:6px auto 12px;max-width:34ch}
  .welcome .ex{display:grid;gap:8px;margin:0 auto 16px;max-width:320px}
  .welcome .ex button{border:1.5px dashed var(--ink-2);border-radius:var(--wob);padding:8px 12px;color:var(--ink-2);font-size:.95rem;background:var(--paper);font-style:italic}
  .lbtn{min-height:42px;padding:0 14px;border-radius:var(--wob);border:var(--b);font-weight:700;color:var(--ink);background:var(--paper);display:inline-flex;align-items:center;gap:6px}

  /* ---------- calendar: an even ink grid of square cells ---------- */
  .cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .cal-h h1{font-size:2rem;line-height:1.1;white-space:nowrap}
  .cal-h h1 small{font-family:'Naskh',serif;font-size:.5em;color:var(--muted);font-weight:500;margin-inline-start:6px}
  .navb{width:42px;height:42px;border:var(--b);border-radius:var(--wob);display:grid;place-items:center;background:var(--paper)}
  .tbtn{height:42px;padding:0 12px;border:var(--b);border-radius:var(--wob);font-weight:700;background:var(--paper)}
  .navb:active,.tbtn:active{transform:translateY(1px)}
  .seg{display:inline-flex;border:var(--b);border-radius:var(--wob);overflow:hidden;margin-bottom:12px;background:var(--paper)}
  .seg button{height:36px;padding:0 16px;font-size:.9rem;font-weight:700}
  .seg button+button{border-inline-start:var(--b)}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .calbox{touch-action:pan-y}
  .wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:2px}
  .wd div{text-align:center;font-family:'Ruqaa',serif;font-size:.95rem;color:var(--ink-2)}
  .mgrid,.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:var(--b);border-inline-start:var(--b);background:var(--paper)}
  .d,.w{position:relative;border-inline-end:var(--b);border-bottom:var(--b);display:flex;flex-direction:column;align-items:stretch;text-align:start;background:var(--paper)}
  .d{aspect-ratio:1/1;padding:4px 5px}
  .d .dn,.w .dn{position:relative;z-index:0;align-self:flex-start;font-weight:700;font-size:1rem;line-height:1.5;padding:0 4px;font-variant-numeric:tabular-nums}
  .d.out{background:repeating-linear-gradient(-45deg,var(--paper) 0 6px,var(--hatch) 6px 7px)}
  .d.out .dn{color:var(--faint);font-weight:500}
  /* highlighter under today's number */
  .d.today .dn::before,.w.today .dn::before{content:'';position:absolute;inset:5px -3px 1px;background:var(--hl);z-index:-1;border-radius:3px 8px 4px 9px;transform:rotate(-2deg)}
  .d.today .dn,.w.today .dn{color:var(--hl-ink)}
  /* red pen ring drawn around the selected cell */
  .d.sel::after,.w.sel::after{content:'';position:absolute;inset:4px;border:2px solid var(--red);border-radius:48% 52% 46% 54% / 55% 45% 55% 45%;transform:rotate(-2deg);pointer-events:none}
  .d:active,.w:active{background:var(--paper-2)}
  .dd{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:auto;min-height:8px}
  .dot{width:7px;height:7px;border-radius:50% 45% 55% 50%;flex:none}
  .dot.done{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
  .dot.exam{border-radius:0;width:9px;height:9px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .dd .pl{font-size:.65rem;color:var(--muted);line-height:1}
  /* week: seven tall cells in the same ink grid, weekday written inside */
  .w{aspect-ratio:1/1.55;padding:5px 5px 6px;align-items:center;text-align:center}
  .w .wn{font-family:'Ruqaa',serif;font-size:.9rem;color:var(--ink-2);line-height:1.3}
  .w .dn{align-self:center;font-size:1.25rem}
  .w .dd{justify-content:center}
  .w .cnt{font-size:.7rem;color:var(--muted)}
  .legend{display:flex;flex-wrap:wrap;gap:3px 12px;padding:8px 2px 0;font-size:.8rem;color:var(--ink-2)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .day-h{display:flex;align-items:flex-end;gap:10px;margin:22px 2px 6px}
  .day-h .num{font-family:'Ruqaa',serif;font-size:3rem;line-height:.9;font-weight:700}
  .day-h h2{font-size:1.35rem;line-height:1.2}
  .day-h .r{color:var(--muted);font-size:.88rem}
  .day-h .c{margin-inline-start:auto;color:var(--muted);font-size:.85rem}

  /* ---------- tab bar ---------- */
  .tabbar{position:fixed;z-index:30;inset-inline:0;bottom:0;height:calc(var(--tabbar) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;background:var(--paper);border-top:var(--b)}
  .tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.8rem;font-weight:700;color:var(--faint)}
  .tab[aria-current=page]{color:var(--ink)}
  .tab[aria-current=page] .tl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
  .tab .tw{position:relative}
  .tab .b{position:absolute;top:-6px;inset-inline-end:-12px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;display:grid;place-items:center;font-family:'Naskh',serif}
  .add{justify-self:center;width:58px;height:58px;border-radius:18px 16px 19px 15px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:3px 4px 0 rgba(31,42,68,.25);transform:translateY(-12px)}
  .add:active{transform:translateY(-10px);box-shadow:1px 1px 0 rgba(31,42,68,.25)}

  /* ---------- sheets ---------- */
  dialog.sheet{border:var(--b);border-bottom:0;padding:0;background:var(--paper);color:var(--ink);font-family:inherit;width:100%;max-width:100%;max-height:94dvh;margin:auto 0 0;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(31,42,68,.2);
    background-image:radial-gradient(var(--dotgrid) 1.2px,transparent 1.3px);background-size:22px 22px}
  dialog.sheet[open]{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(32px);opacity:.5}to{transform:none;opacity:1}}
  dialog.sheet::backdrop{background:var(--scrim)}
  .sheet form,.sheet .wrapf{display:flex;flex-direction:column;max-height:94dvh}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--soft);margin:8px auto 0}
  .sh-head{display:flex;align-items:center;gap:10px;padding:6px 12px 2px 16px}
  .sh-head h2{font-size:1.5rem;flex:1}
  .sh-body{padding:4px 16px 10px;overflow:auto;display:grid;gap:14px;overscroll-behavior:contain}
  .sh-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px calc(12px + var(--safe-b));border-top:1px dashed var(--soft);background:var(--paper)}
  .big-in{width:100%;font-size:18px;font-weight:600;border:0;border-bottom:1.5px solid var(--ink);background:transparent;padding:10px 2px;outline:none}
  .big-in::placeholder{color:var(--faint);font-weight:400;font-style:italic}
  .heard{font-size:.82rem;color:var(--muted);min-height:1.2em;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .field{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
  .lab{font-family:'Ruqaa',serif;font-size:1rem;color:var(--ink-2)}
  .scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 4px;margin:0 -16px}
  .scroller::-webkit-scrollbar{display:none}
  .opt{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:var(--b);border-radius:var(--wob);background:var(--paper);font-size:.92rem;font-weight:600;white-space:nowrap}
  .opt[aria-pressed=true]{background:var(--ink);color:var(--paper)}
  .opt .sw{width:10px;height:10px;border-radius:50%}
  .opt.p1[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:#fff}
  .opt.p2[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
  .in{font-size:16px;background:var(--paper);border:var(--b);border-radius:var(--wob);padding:8px 10px;min-height:40px}
  .in:focus{outline:none;box-shadow:0 0 0 3px var(--soft)}
  .in.sm{flex:none;width:auto}
  .trow{display:flex;align-items:center;gap:10px;margin-top:2px}
  .trow .in{min-width:130px}
  .trow .clr{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
  textarea.in{min-height:70px;resize:vertical;width:100%}
  details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Ruqaa',serif;font-size:1rem;color:var(--ink-2);min-height:40px}
  details.more summary::-webkit-details-marker{display:none}
  details.more[open] summary .ic{transform:rotate(180deg)}
  details.more .inner{display:grid;gap:12px;padding-top:4px}
  .err{color:var(--red);font-size:.85rem}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:var(--wob);border:var(--b);font-weight:700;background:var(--paper);color:var(--ink)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.ghost{background:transparent}
  .btn.danger{border-color:transparent;color:var(--red);background:transparent;padding:0 10px}
  .btn.danger-fill{background:var(--red);border-color:var(--red);color:#fff}
  .btn.wide{width:100%}
  .hint{font-size:.82rem;color:var(--muted);margin:0}
  .check{display:flex;gap:10px;align-items:center;min-height:44px}
  .check input{width:22px;height:22px;accent-color:var(--ink)}

  /* settings */
  .set h3{font-size:1.25rem;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .set section{border-bottom:1px dashed var(--soft);padding-bottom:16px}
  .set section:last-child{border:0}
  .subj{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .subj .swb{width:42px;height:42px;border-radius:var(--wob);border:var(--b);display:grid;place-items:center;background:var(--paper)}
  .subj .swb i{width:18px;height:18px;border-radius:50%}
  .subj .in{width:100%}
  .palette{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
  .palette button{width:38px;height:38px;border-radius:50%;border:2px solid transparent}
  .palette button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .status{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:6px 0 0}
  .status i{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .status.off i{background:var(--faint)}
  ol.steps{margin:6px 0 0;padding-inline-start:20px;font-size:.92rem}
  ol.steps li{margin-bottom:4px}
  .note{border:1.5px dashed var(--ink-2);border-radius:var(--wob);padding:10px 12px;font-size:.88rem;color:var(--ink-2)}

  .toast{position:fixed;inset-inline:12px;bottom:calc(var(--tabbar) + 14px + var(--safe-b));z-index:100;margin-inline:auto;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:8px 8px 8px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:translateY(12px);opacity:0;pointer-events:none;transition:transform .2s ease-out,opacity .2s ease-out;font-size:.95rem}
  .toast span{flex:1}
  .toast.show{transform:none;opacity:1;pointer-events:auto}
  .toast button{border:0;color:#FFE98A;font-weight:700;min-height:40px;padding:0 10px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  [data-theme=dark] .toast button{color:#B93A0C}

  /* ---------- tablet / desktop: the open two-page notebook ---------- */
  @media (min-width:900px){
    body[data-tab] #calPane,body[data-tab] #agendaPane{display:block}
    main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);margin:18px auto;padding:0;background:var(--paper);border-radius:10px;
      box-shadow:0 2px 0 var(--soft),0 4px 0 var(--soft),0 24px 60px rgba(60,45,20,.18);
      background-image:radial-gradient(var(--dotgrid) 1.2px,transparent 1.3px);background-size:22px 22px}
    html,body{background-color:var(--desk)}
    body{background-image:radial-gradient(rgba(0,0,0,.04) 1px,transparent 1px);background-size:6px 6px}
    .pane{padding:26px 30px 40px}
    #agendaPane{border-inline-end:1px solid var(--soft);padding-inline-start:46px}
    #agendaPane::before{content:'';position:absolute;top:0;bottom:0;inset-inline-start:30px;width:2px;background:var(--margin);opacity:.5}
    .tabbar{inset-inline:auto;inset-inline-end:28px;bottom:28px;width:auto;height:auto;padding:0;background:none;border:0;display:block}
    .tabbar .tab{display:none}
    .add{transform:none}
    .toast{bottom:28px}
    .d{aspect-ratio:auto;min-height:88px}
    .w{aspect-ratio:auto;min-height:150px}
    dialog.sheet{width:min(560px,calc(100vw - 32px));margin:auto;border-radius:12px;border-bottom:var(--b)}
    .grab{display:none}
  }
  @media (prefers-reduced-motion:reduce){dialog.sheet[open]{animation:none}.toast,.row-in{transition:none}}
</style>
</head>
<body data-tab="agenda">
<header class="bar">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28">مُنجز</div>
  <span class="sp"></span>
  <button class="ibtn" data-act="theme" id="themeBtn" aria-label="الوضع الليلي"></button>
  <button class="ibtn" data-act="menu" id="menuBtn" aria-label="الإعدادات"></button>
</header>

<main>
  <section class="pane" id="agendaPane" aria-label="مهامي">
    <div id="glance"></div>
    <form class="qa" id="qaAgenda" autocomplete="off" data-default="today">
      <div class="qa-row">
        <span class="qi"></span>
        <label class="sr" for="qaAgendaIn">أضف مهمة</label>
        <input id="qaAgendaIn" list="recent" enterkeyhint="done" maxlength="140" placeholder="اكتب مهمة… مثل: واجب رياضيات بكرة">
        <button type="button" class="more" data-more aria-label="تفاصيل"></button>
        <button type="submit" class="go" hidden>أضف</button>
      </div>
      <div class="qprev" hidden></div>
    </form>
    <div id="examNote"></div>
    <div id="agenda"></div>
  </section>

  <section class="pane" id="calPane" aria-label="التقويم">
    <div class="cal-h">
      <h1 id="mt" aria-live="polite"></h1>
      <span class="sp"></span>
      <button class="tbtn" data-act="today">اليوم</button>
      <button class="navb" data-act="prev" id="pv" aria-label="السابق"></button>
      <button class="navb" data-act="next" id="nx" aria-label="التالي"></button>
    </div>
    <div class="seg" role="group" aria-label="طريقة العرض">
      <button data-act="view" data-v="month" id="vMonth">شهر</button>
      <button data-act="view" data-v="week" id="vWeek">أسبوع</button>
    </div>
    <div class="calbox" id="calbox">
      <div class="wd" id="wd"></div>
      <div id="grid" role="grid" aria-label="الأيام"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="day-h" id="dayHead"></div>
    <div id="dayList"></div>
    <form class="qa" id="qaDay" autocomplete="off" data-default="selected" style="margin-top:8px">
      <div class="qa-row">
        <span class="qi"></span>
        <label class="sr" for="qaDayIn">أضف مهمة لهذا اليوم</label>
        <input id="qaDayIn" list="recent" enterkeyhint="done" maxlength="140" placeholder="أضف لهذا اليوم…">
        <button type="button" class="more" data-more aria-label="تفاصيل"></button>
        <button type="submit" class="go" hidden>أضف</button>
      </div>
      <div class="qprev" hidden></div>
    </form>
  </section>
</main>

<nav class="tabbar" aria-label="التنقل">
  <button class="tab" data-act="tab" data-t="agenda" id="tAgenda"></button>
  <button class="add" data-act="new" id="addBtn" aria-label="مهمة جديدة"></button>
  <button class="tab" data-act="tab" data-t="cal" id="tCal"></button>
</nav>
<datalist id="recent"></datalist>

<script src="core.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
